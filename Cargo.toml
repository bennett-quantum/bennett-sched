[package]
name = "bennett-sched"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
ryu-js = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

# Exhaustive constructor simulations replay millions of Boolean gates. Keep
# those witnesses in the push gate with optimization and all debug checks.
[profile.test]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

[[test]]
name = "integration"
path = "tests/integration.rs"
