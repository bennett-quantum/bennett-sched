# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-sched"
tool_sha = "822aaeffab369114e1a719a7b887a0192b22d386"
timeout_s = 7200

# Paths no check reads; changing only these reuses a PASS receipt (bennett/tools/gate_README.md).
[receipt]
non_product = [".beads/", "worklog/"]

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
BENNETT_REF_BIN = "{sibling:bennett-isa-spec}/reference-interpreter/target/debug/bennett-isa-ref"

[[check]]
name = "cargo test"
argv = ["cargo", "test", "--offline", "-j3", "--", "--test-threads=4"]

[[check]]
name = "slow exhaustive simulations"
tier = "post-merge"  # long tail: main-health runs --tier full after landing
argv = ["cargo", "test", "--offline", "-j3", "--", "--ignored", "--test-threads=4"]

[[check]]
name = "cargo fmt"
argv = ["cargo", "fmt", "--", "--check"]

[[check]]
name = "quality baseline"
argv = ["python3", "-B", "scripts/quality.py", "--check"]

[siblings."bennett-isa-spec"]
sha = "3b1090790d82a00ac95d30b8da6b42d1d7a9f5d1"
note = "isa-spec main 3b10907, quality floor merge, K91 token_aliases reader"
[siblings."bennett-isa-spec".files]
"spec/Bennett-ISA-Spec-0.9.md" = "54dde0c83ff31d0a76de1814ac00273c3bb63fbd9c91d71aea625ad714959c5f"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (debug)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline"]
outputs = ["reference-interpreter/target/debug/bennett-isa-ref"]
env = { CARGO_BUILD_JOBS = "4" }
