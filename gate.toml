# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-sched"
tool_sha = "c698ce1c56d33fdae36624b8616d673a8836679a"
timeout_s = 7200

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
BENNETT_REF_BIN = "{sibling:bennett-isa-spec}/reference-interpreter/target/debug/bennett-isa-ref"

[[check]]
name = "cargo test"
argv = ["cargo", "test", "--offline", "-j4", "--", "--test-threads=4"]

[[check]]
name = "cargo fmt"
argv = ["cargo", "fmt", "--", "--check"]

[siblings."bennett-isa-spec"]
sha = "ecaaac060c44e317d1181345fa6b8e38c096c099"
note = "SPEC_VERSIONS.toml spec_commit; ISA main as gated by the 2026-11-02 push wave"
[siblings."bennett-isa-spec".files]
"spec/Bennett-ISA-Spec-0.9.md" = "021d5df978f293c36174b73de9facc0884f7502a4bc5c0ab7a621b0ca7071c25"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (debug)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline"]
outputs = ["reference-interpreter/target/debug/bennett-isa-ref"]
env = { CARGO_BUILD_JOBS = "4" }
